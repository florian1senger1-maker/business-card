<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="900"
     viewBox="0 0 600 900">

  <defs>
    <pattern id="dots"
             width="10" height="10"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.45" fill="#15579d"/>
    </pattern>

    <linearGradient id="fade"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.82"/>
    </linearGradient>

    <mask id="fadeMask">
      <rect width="600" height="900" fill="white"/>
      <rect width="600" height="900" fill="url(#fade)"/>
    </mask>
  </defs>

  <g opacity="0.30" mask="url(#fadeMask)">

    <path
      d="M610,-40
         C360,55 245,150 320,255
         C390,355 575,350 565,475
         C555,600 330,615 250,735
         C200,810 250,865 335,930
         L650,930 L650,-40 Z"
      fill="url(#dots)"/>

    <path
      d="M650,80
         C455,135 375,215 415,300
         C455,385 610,405 590,505
         C570,610 420,665 390,760
         C370,820 400,875 455,930
         L650,930 Z"
      fill="url(#dots)"
      opacity="0.55"/>

  </g>
</svg>
