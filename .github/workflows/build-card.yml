name: Build business card

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build electronic card
        run: python build.py content/card.yml -o output/Florian_Senger_Business_Card.pdf

      - name: Build print business card
        run: python print/build_print.py

      - name: Upload business cards
        uses: actions/upload-artifact@v4
        with:
          name: Florian-Senger-Business-Cards
          path: |
            output/Florian_Senger_Business_Card.pdf
            output/Florian_Senger_Business_Card_Print.pdf
